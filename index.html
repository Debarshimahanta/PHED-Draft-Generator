function q(id){return document.getElementById(id)}
function e(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function blocks(t){var o=[];(t||"").split(/\n\s*\n/).forEach(function(r){if(!r)return;var ls=r.split(/\n/),n=ls.filter(function(x){return x.trim()});if(n.length&&n.every(function(x){return /^\s*(?:\d+[.)]|[A-Za-z][.)]|[-•])\s+/.test(x)})){n.forEach(function(x){o.push(["l",x])})}else if(n.length>=2&&n.every(function(x){return x.trim().length<=80})){n.forEach(function(x){o.push(["s",x])})}else{o.push(["p",r])}});return o}
function cs(x){var d=(x.designation||"").trim(),b="";if(!d)return"";if(x.category==="Info & Action")b="The "+d+" for favour of information and necessary action.";else if(x.category==="Kind Information")b="The "+d+" for favour of kind information.";else if(x.category==="PS Intimation")b=x.ps?"The "+d+" for kind intimation of "+x.ps+".":"The "+d+" for kind intimation.";else b=(x.custom||"").trim()||"The "+d;if((x.extra||"").trim()){if(!/[.!?]$/.test(b))b+=".";b+=" "+x.extra.trim()}return b}
function rc(){var h=q("copies");h.innerHTML="";S.copies.forEach(function(x,i){var d=document.createElement("div");d.className="copy-card";var opts=["Info & Action","Kind Information","PS Intimation","Custom"].map(function(v){return '<option'+(v===x.category?' selected':'')+'>'+v+'</option>'}).join("");d.innerHTML='<div class="copy-grid"><div><label>Designation / Address</label><input data-i="'+i+'" data-k="designation" placeholder="e.g. Superintending Engineer (PHE), Guwahati Circle" value="'+e(x.designation)+'"></div><div><label>Category</label><select data-i="'+i+'" data-k="category">'+opts+'</select></div></div>'+(x.category==="PS Intimation"?'<label>Intimation to designation</label><input data-i="'+i+'" data-k="ps" placeholder="e.g. Special Chief Secretary (PHE) Department" value="'+e(x.ps)+'">':'')+(x.category==="Custom"?'<label>Exact copy text</label><textarea data-i="'+i+'" data-k="custom" placeholder="Type the exact copy wording here">'+e(x.custom)+'</textarea>':'')+'<label>Additional instruction</label><input data-i="'+i+'" data-k="extra" placeholder="Optional: e.g. He is also requested to attend the meeting." value="'+e(x.extra)+'"><div class="toolbar"><button class="btn" data-r="'+i+'">Remove</button></div>';h.appendChild(d)});h.querySelectorAll("[data-k]").forEach(function(el){el.oninput=function(){var i=+this.dataset.i,k=this.dataset.k;S.copies[i][k]=this.value;if(k==="category")rc();render()}});h.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){S.copies.splice(+this.dataset.r,1);rc();render()}})}
function bodyHtml(){var firstPara=true;return blocks(q("body").value).map(function(x){if(x[0]==="p"){var cls=firstPara?"body-paragraph first-paragraph":"body-paragraph";firstPara=false;return '<p class="'+cls+'">'+e(x[1]).replace(/\n/g,"<br>")+'</p>'}if(x[0]==="l")return '<div class="body-listline">'+e(x[1])+'</div>';return '<div class="body-shortline">'+e(x[1])+'</div>'}).join("")}

function letterHtml(){var copies=S.copies.filter(function(x){return(x.designation||"").trim()});return headerHtml()+'<div class="meta"><div><b>No. '+e(q("fileNo").value)+'</b></div><div></div></div><div class="to"><b>To,</b><br>'+e(q("addressee").value).replace(/\n/g,"<br>")+'</div><div class="subject"><b>Sub:</b> '+e(q("subject").value)+'</div><div class="salutation">'+e(q("salutation").value)+',</div>'+bodyHtml()+signHtml(false)+(copies.length?'<div class="copyhead">Copy to:</div>'+copies.map(function(x,i){return '<div class="copyline"><span>'+(i+1)+'.</span><div>'+e(cs(x))+'</div></div>').join("")+signHtml(true):"")}

function previewBlocks(){
  var out=[];
  out.push(headerHtml());
  out.push('<div class="meta"><div><b>No. '+e(q("fileNo").value)+'</b></div><div></div></div>');
  out.push('<div class="to"><b>To,</b><br>'+e(q("addressee").value).replace(/\n/g,"<br>")+'</div>');
  out.push('<div class="subject"><b>Sub:</b> '+e(q("subject").value)+'</div>');
  out.push('<div class="salutation">'+e(q("salutation").value)+',</div>');

  var firstPara=true;
  blocks(q("body").value).forEach(function(x){
    if(x[0]==="p"){
      var cls=firstPara?"body-paragraph first-paragraph":"body-paragraph";
      firstPara=false;
      out.push('<p class="'+cls+'">'+e(x[1]).replace(/\n/g,"<br>")+'</p>');
    }else if(x[0]==="l"){
      out.push('<div class="body-listline">'+e(x[1])+'</div>');
    }else{
      out.push('<div class="body-shortline">'+e(x[1])+'</div>');
    }
  });

  out.push(signHtml(false));

  var copies=S.copies.filter(function(x){return(x.designation||"").trim()});
  if(copies.length){
    out.push('<div class="copyhead">Copy to:</div>');
    copies.forEach(function(x,i){
      out.push('<div class="copyline"><span>'+(i+1)+'.</span><div>'+e(cs(x))+'</div></div>');
    });
    out.push(signHtml(true));
  }
  return out;
}

function makePage(pageNo){
  var page=document.createElement("div");
  page.className="page";
  var inner=document.createElement("div");
  inner.className="page-inner";
  var num=document.createElement("div");
  num.className="page-number";
  num.textContent="Page "+pageNo;
  page.appendChild(inner);
  page.appendChild(num);
  return {page:page,inner:inner};
}

function nodeFromHtml(html){
  var wrap=document.createElement("div");
  wrap.innerHTML=html.trim();
  return wrap.firstElementChild;
}

function fits(inner,node){
  inner.appendChild(node);
  var ok=inner.scrollHeight<=inner.clientHeight+1;
  inner.removeChild(node);
  return ok;
}

function splitTextNodeToFit(html,inner){
  var source=nodeFromHtml(html);
  if(!source)return [html];

  var plain=source.innerText||source.textContent||"";
  var words=plain.split(/\s+/).filter(Boolean);
  if(words.length<2)return [html];

  var cls=source.className||"";
  var chunks=[];
  var start=0;

  while(start<words.length){
    var lo=start+1,hi=words.length,best=start;
    while(lo<=hi){
      var mid=Math.floor((lo+hi)/2);
      var text=words.slice(start,mid).join(" ");
      var test=document.createElement(source.tagName.toLowerCase());
      test.className=cls;
      if(start>0)test.classList.remove("first-paragraph");
      test.textContent=text;
      if(fits(inner,test)){best=mid;lo=mid+1}else{hi=mid-1}
    }
    if(best===start)best=start+1;
    var piece=document.createElement(source.tagName.toLowerCase());
    piece.className=cls;
    if(start>0)piece.classList.remove("first-paragraph");
    piece.textContent=words.slice(start,best).join(" ");
    chunks.push(piece.outerHTML);
    start=best;
  }
  return chunks;
}

function renderPaginatedPreview(){
  var host=q("previewPages");
  host.innerHTML="";

  var measure=document.querySelector(".measure-host");
  if(measure)measure.remove();
  measure=document.createElement("div");
  measure.className="measure-host";
  document.body.appendChild(measure);

  var pageNo=1;
  var visible=makePage(pageNo);
  var measured=makePage(pageNo);
  host.appendChild(visible.page);
  measure.appendChild(measured.page);

  function newPage(){
    pageNo++;
    visible=makePage(pageNo);
    measured=makePage(pageNo);
    host.appendChild(visible.page);
    measure.innerHTML="";
    measure.appendChild(measured.page);
  }

  previewBlocks().forEach(function(html){
    var v=nodeFromHtml(html),m=nodeFromHtml(html);
    if(!v||!m)return;

    measured.inner.appendChild(m);
    if(measured.inner.scrollHeight<=measured.inner.clientHeight+1){
      visible.inner.appendChild(v);
      return;
    }
    measured.inner.removeChild(m);

    if(visible.inner.children.length===0){
      splitTextNodeToFit(html,measured.inner).forEach(function(piece,idx){
        var pv=nodeFromHtml(piece),pm=nodeFromHtml(piece);
        measured.inner.appendChild(pm);
        if(measured.inner.scrollHeight>measured.inner.clientHeight+1 && visible.inner.children.length){
          measured.inner.removeChild(pm);
          newPage();
          pm=nodeFromHtml(piece);
          measured.inner.appendChild(pm);
        }
        visible.inner.appendChild(pv);
        if(idx<splitTextNodeToFit(html,measured.inner).length-1)newPage();
      });
      return;
    }

    newPage();
    m=nodeFromHtml(html);
    measured.inner.appendChild(m);

    if(measured.inner.scrollHeight<=measured.inner.clientHeight+1){
      visible.inner.appendChild(v);
    }else{
      measured.inner.removeChild(m);
      var pieces=splitTextNodeToFit(html,measured.inner);
      pieces.forEach(function(piece,idx){
        var pv=nodeFromHtml(piece),pm=nodeFromHtml(piece);
        measured.inner.appendChild(pm);
        if(measured.inner.scrollHeight>measured.inner.clientHeight+1 && visible.inner.children.length){
          measured.inner.removeChild(pm);
          newPage();
          pm=nodeFromHtml(piece);
          measured.inner.appendChild(pm);
        }
        visible.inner.appendChild(pv);
        if(idx<pieces.length-1)newPage();
      });
    }
  });

  measure.remove();
}

function render(){renderPaginatedPreview()}
