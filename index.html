function q(id){return document.getElementById(id)}
q("date").value=new Date().toISOString().slice(0,10);
function e(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fd(v){if(!v)return"";var a=v.split("-");return a[2]+"/"+a[1]+"/"+a[0]}
function blocks(t){var o=[];(t||"").split(/\n\s*\n/).forEach(function(r){if(!r)return;var ls=r.split(/\n/),n=ls.filter(function(x){return x.trim()});if(n.length&&n.every(function(x){return /^\s*(?:\d+[.)]|[A-Za-z][.)]|[-•])\s+/.test(x)})){n.forEach(function(x){o.push(["l",x])})}else if(n.length>=2&&n.every(function(x){return x.trim().length<=80})){n.forEach(function(x){o.push(["s",x])})}else{o.push(["p",r])}});return o}

function rc(){var h=q("copies");h.innerHTML="";S.copies.forEach(function(x,i){var d=document.createElement("div");d.className="copy-card";var opts=["Info & Action","Kind Information","PS Intimation","Custom"].map(function(v){return '<option'+(v===x.category?' selected':'')+'>'+v+'</option>'}).join("");d.innerHTML='<div class="copy-grid"><div><label>Designation / Address</label><input data-i="'+i+'" data-k="designation" value="'+e(x.designation)+'"></div><div><label>Category</label><select data-i="'+i+'" data-k="category">'+opts+'</select></div></div>'+(x.category==="PS Intimation"?'<label>Intimation to designation</label><input data-i="'+i+'" data-k="ps" value="'+e(x.ps)+'">':'')+(x.category==="Custom"?'<label>Exact copy text</label><textarea data-i="'+i+'" data-k="custom">'+e(x.custom)+'</textarea>':'')+'<label>Additional instruction</label><input data-i="'+i+'" data-k="extra" value="'+e(x.extra)+'"><div class="toolbar"><button class="btn" data-r="'+i+'">Remove</button></div>';h.appendChild(d)});h.querySelectorAll("[data-k]").forEach(function(el){el.oninput=function(){var i=+this.dataset.i,k=this.dataset.k;S.copies[i][k]=this.value;if(k==="category")rc();render()}});h.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){S.copies.splice(+this.dataset.r,1);rc();render()}})}
